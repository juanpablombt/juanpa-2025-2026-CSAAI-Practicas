<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot League - Práctica 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <header>
            <h1>Bot League</h1>
            <p id="sub-header">Versión 1.0 · Movimiento, dirección y chut</p>
        </header>

        <div id="scoreboard">
            <div class="score" id="score-blue">0</div>
            <div class="divider">-</div>
            <div class="score" id="score-red">0</div>
            <div id="game-mode-label">Modo: Seleccionando...</div>
        </div>

        <div id="field">
            <div class="goal left"></div>
            <div class="goal right"></div>
            <div class="center-line"></div>
            <div class="center-circle"></div>
            
            <canvas id="gameCanvas"></canvas>

            <div id="menu-overlay" class="overlay">
                <h2>Elige modo de juego</h2>
                <button onclick="startGame('3goals')">Pulsa 1: Partido a 3 goles</button>
                <button onclick="startGame('golden')">Pulsa 2: Gol de oro</button>
            </div>

            <div id="countdown-overlay" class="overlay hidden">
                <span id="countdown-number">3</span>
            </div>

            <div id="message-overlay" class="overlay hidden">
                <h2 id="status-text">¡GOOOL!</h2>
            </div>

            <div id="final-overlay" class="overlay hidden">
                <h2 id="winner-text">¡Has ganado!</h2>
                <p>Pulsa R para reiniciar</p>
                <p>Pulsa M para volver al menú</p>
            </div>
        </div>

        <footer>
            <p><strong>Controles:</strong> Flechas para mover · A/D para girar dirección · Espacio para chutar</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
